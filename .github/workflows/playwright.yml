name: Playwright Tests

on:
  push:
    branches:
      - main
      - master
      - 'epic/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Specific test file to run (blank = all tests)'
        required: false
        default: ''
      browser:
        description: 'Browser to test on'
        required: false
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
      grep_tag:
        description: 'Filter tests by tag (e.g. @smoke, @regression)'
        required: false
        default: ''

env:
  NODE_ENV: development

# ─── JOB 1: Run tests in 4 parallel shards ────────────────────────────────────
jobs:
  test:
    name: Shard ${{ matrix.shard }}/4
    timeout-minutes: 30
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false       # Don't cancel other shards if one fails
      matrix:
        shard: [1, 2, 3, 4]  # 4 VMs run simultaneously

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Set environment URL
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == "refs/heads/master" ]]; then
            echo "BASE_URL=https://rahulshettyacademy.com" >> $GITHUB_ENV
            echo "NODE_ENV=production" >> $GITHUB_ENV
          else
            echo "BASE_URL=https://rahulshettyacademy.com" >> $GITHUB_ENV
            echo "NODE_ENV=development" >> $GITHUB_ENV
          fi

      - name: Run Playwright tests (shard ${{ matrix.shard }}/4)
        run: |
          BROWSER="${{ github.event.inputs.browser }}"
          BROWSER="${BROWSER:-chromium}"

          # Exclude visual regression — baselines are OS-specific (win32 vs linux)
          # Run locally with: npm run test:visual
          CMD="npx playwright test --project=$BROWSER --shard=${{ matrix.shard }}/4 --reporter=blob --ignore=tests/visual.spec.js"

          if [ -n "${{ github.event.inputs.test_file }}" ]; then
            CMD="$CMD ${{ github.event.inputs.test_file }}"
          fi

          if [ -n "${{ github.event.inputs.grep_tag }}" ]; then
            CMD="$CMD --grep ${{ github.event.inputs.grep_tag }}"
          fi

          echo "Running: $CMD"
          eval $CMD
        env:
          CI: true
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload blob report for this shard
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1    # Only needed until merge job runs

      - name: Upload failure screenshots/videos/traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: test-results/
          retention-days: 7

# ─── JOB 2: Merge all shard reports into one HTML report ──────────────────────
  merge-reports:
    name: Merge Reports
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into single HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

      - name: Comment on PR with test results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const conclusion = '${{ needs.test.result }}';
            const emoji = conclusion === 'success' ? '✅' : '❌';
            const body = [
              `## ${emoji} Playwright Tests (4 shards)`,
              '',
              `| Field | Value |`,
              `|-------|-------|`,
              `| Status | **${conclusion.toUpperCase()}** |`,
              `| Branch | \`${{ github.head_ref }}\` |`,
              `| Target | \`${{ github.base_ref }}\` |`,
              `| Shards | 4 parallel VMs |`,
              `| Report | [Download Artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
