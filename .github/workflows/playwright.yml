name: Playwright Tests

on:
  push:
    branches:
      - main
      - master
      - 'epic/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Specific test file to run (blank = all tests)'
        required: false
        default: ''
      browser:
        description: 'Browser to test on'
        required: false
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
      grep_tag:
        description: 'Filter tests by tag (e.g. @smoke, @regression)'
        required: false
        default: ''

env:
  NODE_ENV: development

jobs:
  playwright-tests:
    name: Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Set environment URL
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == "refs/heads/master" ]]; then
            echo "BASE_URL=https://rahulshettyacademy.com" >> $GITHUB_ENV
            echo "NODE_ENV=production" >> $GITHUB_ENV
          else
            echo "BASE_URL=https://rahulshettyacademy.com" >> $GITHUB_ENV
            echo "NODE_ENV=development" >> $GITHUB_ENV
          fi

      - name: Run Playwright tests
        run: |
          BROWSER="${{ github.event.inputs.browser }}"
          BROWSER="${BROWSER:-chromium}"

          CMD="npx playwright test --project=$BROWSER"

          if [ -n "${{ github.event.inputs.test_file }}" ]; then
            CMD="$CMD ${{ github.event.inputs.test_file }}"
          fi

          if [ -n "${{ github.event.inputs.grep_tag }}" ]; then
            CMD="$CMD --grep ${{ github.event.inputs.grep_tag }}"
          fi

          echo "Running: $CMD"
          eval $CMD
        env:
          CI: true
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test failure artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: test-results/
          retention-days: 7

      - name: Comment on PR with test results
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        with:
          script: |
            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const body = [
              `## ${emoji} Playwright Tests`,
              '',
              `| Field | Value |`,
              `|-------|-------|`,
              `| Status | **${status.toUpperCase()}** |`,
              `| Branch | \`${{ github.head_ref }}\` |`,
              `| Target | \`${{ github.base_ref }}\` |`,
              `| Report | [Download Artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
